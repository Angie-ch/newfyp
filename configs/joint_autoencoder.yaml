# Configuration for Joint Autoencoder Training
# Encodes ERA5 + IBTrACS together, decodes separately

data:
  data_dir: "data/processed_temporal_split"
  past_frames: 8
  future_frames: 12
  era5_channels: 48

model:
  era5_channels: 48
  latent_channels: 8
  hidden_dims: [64, 128, 256, 256]
  use_attention: true
  dropout: 0.1  # Dropout for regularization

training:
  epochs: 50  # Train for 50 epochs
  batch_size: 4  # Reduced from 8 to fit in GPU memory and speed up training
  learning_rate: 1.0e-4
  weight_decay: 0.05  # Increased from 0.01 for better regularization
  gradient_clip: 1.0
  
  # Loss weights - recommended values for optimal performance
  era5_weight: 1.0
  track_weight: 10.0      # Higher weight to prioritize track accuracy
  intensity_weight: 5.0   # Higher weight to prioritize intensity accuracy
  
  # Early stopping
  early_stopping_patience: 5
  
  # Logging
  log_interval: 100
  save_interval: 5
  log_dir: "logs/joint_autoencoder"
  save_dir: "checkpoints/joint_autoencoder"
  
  # Data loading
  num_workers: 4  # Increased for parallel data loading (was 0 - major bottleneck!)

